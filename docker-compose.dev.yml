services:
  whisper-frontend:
    extends:
      file: frontend/docker-compose.yml
      service: whisper-frontend
    env_file:
      - frontend/.env
    depends_on:
      - whisper-backend
    networks:
      - whishper-dev

  whisper-backend:
    extends:
      file: backend/docker-compose.yml
      service: whisper-backend
    env_file:
      - backend/.env
    depends_on:
      - whishper-mongo
      - whisper-api
    networks:
      - whishper-dev

  whishper-mongo:
    extends:
      file: backend/docker-compose.yml
      service: whishper-mongo
    env_file:
      - backend/.env
    networks:
      - whishper-dev

  whisper-api:
    extends:
      file: transcription-api/docker-compose.yml
      service: whisper-api
    env_file:
      - transcription-api/.env
    volumes:
      - ./uploads:/uploads
    networks:
      - whishper-dev

networks:
  whishper-dev:
    name: whishper-dev
    driver: bridge
