services:
  whishper-mongo:
    image: mongo:latest
    container_name: whishper-mongo
    restart: unless-stopped
    env_file:
      - .backend.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-whishper}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-whishper}
    volumes:
      - ./whishper_data/db_data/db:/data/db
      - ./whishper_data/db_data/logs/:/var/log/mongodb/
    expose:
      - 27017
    command: mongod --logpath /var/log/mongodb/mongod.log

  translate:
    image: libretranslate/libretranslate:latest
    container_name: whishper-libretranslate
    restart: unless-stopped
    env_file:
      - .backend.env
    tty: true
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "true"
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,fr}
    volumes:
      - ./whishper_data/libretranslate/data:/home/libretranslate/.local/share
      - ./whishper_data/libretranslate/cache:/home/libretranslate/.local/cache
    ports:
      - 5000:5000
    expose:
      - 5000

  whishper-api:
    build:
      context: ./transcription-api
      dockerfile: Dockerfile.cpu
    container_name: whishper-api
    restart: unless-stopped
    env_file:
      - frontend/.env
    depends_on:
      - whisper-backend
    networks:
      - whishper-dev

  whisper-backend:
    extends:
      file: backend/docker-compose.yml
      service: whisper-backend
    env_file:
      - .backend.env
    environment:
      UPLOAD_DIR: /uploads
      ASR_ENDPOINT: whishper-api:8000
      TRANSLATION_ENDPOINT: translate:5000
      DB_ENDPOINT: whishper-mongo:27017
    volumes:
      - ./whishper_data/uploads:/uploads
      - ./whishper_data/logs:/var/log/whishper
    depends_on:
      - whishper-mongo
      - whisper-api
    networks:
      - whishper-dev

  whishper-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whishper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - 3000
    env_file:
      - backend/.env
    networks:
      - whishper-dev

  whisper-api:
    extends:
      file: transcription-api/docker-compose.yml
      service: whisper-api
    env_file:
      - transcription-api/.env
    volumes:
      - ./uploads:/uploads
    networks:
      - whishper-dev

networks:
  whishper-dev:
    name: whishper-dev
    driver: bridge
