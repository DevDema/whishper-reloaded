# Whishper Reloaded - full single-machine stack (CPU).
#
# Every component runs in its own container using the published images.
# Requires two env files next to this file: .backend.env and .frontend.env
# (see README.md -> "Environment files").
#
#   docker compose up -d
#
# If you want to run the GPU-heavy transcription API on a separate machine,
# drop the `whishper-api` and `translate` services here and point
# ASR_ENDPOINT / TRANSLATION_ENDPOINT in .backend.env at that machine.

services:
  whishper-mongo:
    image: mongo:latest
    container_name: whishper-mongo
    restart: unless-stopped
    env_file:
      - .backend.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-whishper}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-whishper}
    volumes:
      - ./whishper_data/db_data/db:/data/db
      - ./whishper_data/db_data/logs/:/var/log/mongodb/
    expose:
      - 27017
    command: mongod --logpath /var/log/mongodb/mongod.log

  translate:
    image: libretranslate/libretranslate:latest
    container_name: whishper-libretranslate
    restart: unless-stopped
    env_file:
      - .backend.env
    tty: true
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "true"
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,fr}
    volumes:
      - ./whishper_data/libretranslate/data:/home/libretranslate/.local/share
      - ./whishper_data/libretranslate/cache:/home/libretranslate/.local/cache
    ports:
      - 5000:5000
    expose:
      - 5000
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 5

  whishper-api:
    image: thespartan94/whisper-transcription-api-cpu:latest
    container_name: whishper-api
    restart: unless-stopped
    env_file:
      - .backend.env
    environment:
      UPLOAD_DIR: /uploads
      WHISPER_MODELS_DIR: /app/models
      WHISPER_MODELS: ${WHISPER_MODELS:-tiny,small}
      CPU_THREADS: ${CPU_THREADS:-4}
    volumes:
      - ./whishper_data/uploads:/uploads
      - ./whishper_data/models:/app/models
    expose:
      - 8000

  whishper-backend:
    image: thespartan94/whishper-backend:latest
    container_name: whishper-backend
    restart: unless-stopped
    ports:
      - 8080:8080
    env_file:
      - .backend.env
    environment:
      UPLOAD_DIR: /uploads
      ASR_ENDPOINT: whishper-api:8000
      TRANSLATION_ENDPOINT: translate:5000
      DB_ENDPOINT: whishper-mongo:27017
    volumes:
      - ./whishper_data/uploads:/uploads
      - ./whishper_data/logs:/var/log/whishper
    depends_on:
      - whishper-mongo
      - translate
      - whishper-api

  whishper-frontend:
    image: thespartan94/whishper-frontend:latest
    container_name: whishper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - 3000
    env_file:
      - .frontend.env
    volumes:
      - ./whishper_data/frontend/logs:/var/log/whishper
    depends_on:
      - whishper-backend
